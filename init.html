<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>初始化后台 — LikeGirl</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/app/init.css">
  <script src="/app/init.js" defer></script>
</head>
<body>
  <main class="setup-card">
    <div class="heart" aria-hidden="true">♥</div>
    <p class="eyebrow">LIKEGIRL · EDGEONE</p>
    <h1>欢迎，先设置管理密码</h1>
    <p class="intro">完成这一步，就可以管理你们的纪念小站。</p>
    <p id="setup-status" role="status">正在检查初始化状态…</p>
    <form id="setup-form" hidden>
      <label for="password">管理员密码</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required aria-describedby="password-hint">
      <p id="password-hint" class="hint">至少 8 个字符，建议使用字母、数字和符号组合。</p>
      <label for="confirm-password">确认密码</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="256" required>
      <button type="submit">初始化后台</button>
    </form>
    <p id="setup-error" role="alert" hidden></p>
    <button id="setup-retry" type="button" hidden>重新检查</button>
    <p class="footer"><a href="/index.html">返回小站</a> <span>·</span> <a href="/admin.html">管理后台</a></p>
  </main>
</body>
</html>
